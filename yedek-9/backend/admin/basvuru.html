<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOCAL Admin — Mekan başvuruları</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-950 text-slate-100 font-[Inter] min-h-screen">
  <header class="border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <div>
      <a href="hub.html" class="text-xs text-slate-500 hover:text-slate-300">← Hub</a>
      <h1 class="text-lg font-bold">Mekan başvuru kuyruğu</h1>
      <p class="text-xs text-slate-400">VIES/belge · Maps · 5 foto · taahhüt · saatler — white-glove onay</p>
    </div>
    <div class="flex gap-2">
      <select id="app-status" class="bg-slate-900 border-slate-700 rounded-lg text-sm">
        <option value="pending" selected>İncelemede</option>
        <option value="approved">Onaylı</option>
        <option value="rejected">Red</option>
      </select>
      <button id="app-refresh" class="px-3 py-2 bg-blue-600 rounded-lg text-sm font-semibold">Yenile</button>
    </div>
  </header>
  <main class="p-6 max-w-5xl mx-auto">
    <p id="app-info" class="text-sm text-slate-400 mb-4"></p>
    <div id="app-list" class="space-y-3"></div>
  </main>
  <script src="/admin/common.js"></script>
  <script src="/admin/basvuru.js"></script>
</body>
</html>
