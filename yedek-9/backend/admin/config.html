<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOCAL Admin - Config</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-slate-950 text-slate-100 p-8">
  <a href="dashboard.html" class="text-blue-400 text-sm">← Dashboard</a>
  <h1 class="text-2xl font-bold mt-4 mb-2">§12 Config Snapshot</h1>
  <p class="text-slate-400 text-sm mb-6">Read-only kalibrasyon parametreleri (localConfig.js)</p>
  <pre id="out" class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-xs overflow-auto max-h-[80vh]">Yükleniyor…</pre>
  <script src="common.js"></script>
  <script>
    api('/api/admin/config').then(function (res) {
      document.getElementById('out').textContent = JSON.stringify(res.data, null, 2);
    }).catch(function (e) {
      document.getElementById('out').textContent = 'Hata: ' + e.message;
    });
  </script>
</body>
</html>
