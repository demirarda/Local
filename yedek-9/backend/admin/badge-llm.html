<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOCAL Admin - Badge LLM</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-slate-950 text-slate-100 p-8">
  <a href="dashboard.html" class="text-blue-400 text-sm">← Dashboard</a>
  <h1 class="text-2xl font-bold mt-4 mb-2">Badge LLM Onay Kuyruğu</h1>
  <p class="text-slate-400 text-sm mb-6">Launch dönemi manuel onay — otomatik atama yok</p>
  <div id="list" class="space-y-3"></div>
  <script src="common.js"></script>
  <script>
    function render(rows) {
      var el = document.getElementById('list');
      if (!rows.length) {
        el.innerHTML = '<p class="text-slate-500">Bekleyen öneri yok.</p>';
        return;
      }
      el.innerHTML = rows.map(function (r) {
        return '<div class="border border-slate-800 rounded-lg p-4 bg-slate-900">' +
          '<div class="font-semibold">' + escapeHtml(r.suggested_slug) + ' · ' + escapeHtml(r.suggested_level || 'novice') + '</div>' +
          '<div class="text-sm text-slate-400">' + escapeHtml(r.user_name || r.user_id) + ' · ' + formatDate(r.created_at) + '</div>' +
          '<div class="text-sm mt-1">' + escapeHtml(r.reason || '—') + '</div>' +
          '<div class="flex gap-2 mt-3">' +
          '<button data-id="' + r.id + '" data-act="approve" class="px-3 py-1 bg-green-700 rounded text-sm">Onayla</button>' +
          '<button data-id="' + r.id + '" data-act="reject" class="px-3 py-1 bg-red-800 rounded text-sm">Reddet</button>' +
          '</div></div>';
      }).join('');
      el.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.getAttribute('data-id');
          var act = btn.getAttribute('data-act');
          var path = act === 'approve'
            ? '/api/admin/badge-llm-suggestions/' + id + '/approve'
            : '/api/admin/badge-llm-suggestions/' + id + '/reject';
          api(path, { method: 'POST', body: '{}' }).then(load).catch(function (e) { alert(e.message); });
        });
      });
    }
    function load() {
      api('/api/admin/badge-llm-suggestions').then(function (res) {
        render(res.data || []);
      }).catch(function (e) {
        document.getElementById('list').innerHTML = '<p class="text-red-400">' + escapeHtml(e.message) + '</p>';
      });
    }
    load();
  </script>
</body>
</html>
