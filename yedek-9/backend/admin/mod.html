<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOCAL Ops — MOD kuyruğu</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="bg-slate-950 text-slate-100 font-[Inter] min-h-screen">
  <header class="border-b border-slate-800 px-6 py-4 flex flex-wrap items-center justify-between gap-3">
    <div>
      <a href="hub.html" class="text-xs text-slate-500 hover:text-slate-300">← Hub</a>
      <h1 class="text-lg font-bold">MOD kuyruğu</h1>
      <p class="text-xs text-slate-400">L0/L1 tek · L2 four-eyes · L3/L4 iki moderatör + founder. App’te L-aksiyon yok.</p>
    </div>
    <div class="flex gap-2">
      <select id="status" class="bg-slate-900 border-slate-700 rounded-lg text-sm">
        <option value="queued" selected>Kuyruk</option>
        <option value="actioned">İşlendi</option>
        <option value="all">Tümü</option>
      </select>
      <button id="refresh" class="px-3 py-2 bg-blue-600 rounded-lg text-sm font-semibold">Yenile</button>
    </div>
  </header>
  <main class="p-6 max-w-5xl mx-auto space-y-4">
    <p id="info" class="text-sm text-slate-400">SLA: güvenlik 2s · içerik 12s · genel 48s</p>
    <div id="list" class="space-y-3"></div>
    <section class="rounded-xl border border-slate-800 p-4">
      <h2 class="font-semibold mb-2">Aksiyon</h2>
      <label class="text-xs text-slate-400">Rapor id</label>
      <input id="reportId" class="mt-1 w-full bg-slate-900 border-slate-700 rounded-lg text-sm" />
      <label class="text-xs text-slate-400 mt-3 block">Hedef kullanıcı id</label>
      <input id="targetUser" class="mt-1 w-full bg-slate-900 border-slate-700 rounded-lg text-sm" />
      <label class="text-xs text-slate-400 mt-3 block">İkinci moderatör id (L2+)</label>
      <input id="secondMod" class="mt-1 w-full bg-slate-900 border-slate-700 rounded-lg text-sm" />
      <label class="text-xs text-slate-400 mt-3 block">Not</label>
      <input id="note" class="mt-1 w-full bg-slate-900 border-slate-700 rounded-lg text-sm" />
      <div class="flex flex-wrap gap-2 mt-3" id="levels"></div>
      <p id="msg" class="text-sm mt-3"></p>
    </section>
  </main>
  <script src="/admin/common.js"></script>
  <script src="/admin/mod.js"></script>
</body>
</html>
