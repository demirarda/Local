<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOCAL Admin - Kullanıcı Yönetimi</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#3c83f6",
            "background-light": "#f5f7f8",
            "background-dark": "#101722",
          },
          fontFamily: {
            display: ["Inter"],
          },
          borderRadius: {
            DEFAULT: "0.5rem",
            lg: "1rem",
            xl: "1.5rem",
            full: "9999px",
          },
        },
      },
    };
  </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 antialiased">
  <div class="flex min-h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside
      class="w-64 shrink-0 bg-slate-50 dark:bg-[#0b101a] border-r border-slate-200 dark:border-slate-800 flex flex-col">
      <div class="p-6 flex items-center gap-3">
        <div class="size-10 rounded-full bg-primary flex items-center justify-center text-white">
          <span class="material-symbols-outlined">shield_person</span>
        </div>
        <div>
          <h1 class="text-base font-bold leading-none">LOCAL Admin</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Yönetici Paneli</p>
        </div>
      </div>
      <nav class="flex-1 px-4 space-y-1 mt-4">
        <a href="dashboard.html"
          class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
          <span class="material-symbols-outlined text-[22px]">dashboard</span>
          <span class="text-sm font-medium">Panel</span>
        </a>
        <a href="kullanici.html"
          class="flex items-center gap-3 px-3 py-2 bg-primary/10 text-primary rounded-lg transition-colors">
          <span class="material-symbols-outlined text-[22px] fill-1">group</span>
          <span class="text-sm font-medium">Kullanıcılar</span>
        </a>
        <a href="rite.html"
          class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
          <span class="material-symbols-outlined text-[22px]">auto_awesome</span>
          <span class="text-sm font-medium">Ritüeller</span>
        </a>
        <a href="bildirim.html"
          class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
          <span class="material-symbols-outlined text-[22px]">bar_chart</span>
          <span class="text-sm font-medium">Bildirimler</span>
        </a>
        <a href="anilar.html"
          class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
          <span class="material-symbols-outlined text-[22px]">photo_library</span>
          <span class="text-sm font-medium">Anılar</span>
        </a>
        <a href="dogrulama.html"
          class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
          <span class="material-symbols-outlined text-[22px]">verified_user</span>
          <span class="text-sm font-medium">Doğrulama</span>
        </a>
        <a href="mekan.html"
          class="flex items-center gap-3 px-3 py-2 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-colors">
          <span class="material-symbols-outlined text-[22px]">location_on</span>
          <span class="text-sm font-medium">Mekanlar</span>
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col min-w-0 bg-slate-50 dark:bg-background-dark">
      <!-- Header -->
      <header
        class="h-16 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between px-8 bg-white dark:bg-[#0b101a] sticky top-0 z-10">
        <div class="flex items-center gap-4">
          <h2 class="text-lg font-bold">Kullanıcı Yönetimi</h2>
          <span
            class="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-xs font-medium text-slate-500">Kayıtlar</span>
        </div>
        <div class="flex items-center gap-3">
          <button
            class="flex items-center gap-2 px-4 py-2 bg-primary hover:bg-primary/90 text-white text-sm font-semibold rounded-lg transition-all shadow-sm">
            <span class="material-symbols-outlined text-sm">person_add</span>
            Yeni Kullanıcı Ekle
          </button>
        </div>
      </header>

      <div class="p-8 space-y-6">
        <!-- Filter toolbar -->
        <div
          class="bg-white dark:bg-[#161f2e] p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 flex flex-wrap gap-4 items-end">
          <div class="flex-1 min-w-[240px]">
            <label
              class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 ml-1 uppercase tracking-wider">Arama</label>
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xl">search</span>
              <input id="users-search"
                class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-lg pl-10 text-sm focus:ring-2 focus:ring-primary/50 text-slate-700 dark:text-slate-200 placeholder:text-slate-400"
                placeholder="İsim, e-posta veya şehir..." type="text" />
            </div>
          </div>
          <div class="w-48">
            <label
              class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 ml-1 uppercase tracking-wider">Üniversite</label>
            <input id="users-university"
              class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/50 text-slate-700 dark:text-slate-200"
              placeholder="Tüm Üniversiteler" type="text" />
          </div>
          <div class="w-32">
            <label
              class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 ml-1 uppercase tracking-wider">Min
              RS</label>
            <input id="users-rs-min"
              class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/50 text-slate-700 dark:text-slate-200"
              placeholder="0" type="number" min="0" max="10" step="0.1" />
          </div>
          <div class="w-32">
            <label
              class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 ml-1 uppercase tracking-wider">Durum</label>
            <select id="users-status"
              class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/50 text-slate-700 dark:text-slate-200 cursor-pointer">
              <option value="">Tüm Durumlar</option>
              <option value="aktif">Aktif</option>
              <option value="askida">Askıda</option>
            </select>
          </div>
          <div class="w-24">
            <label
              class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1.5 ml-1 uppercase tracking-wider">Sayfa</label>
            <select id="users-limit"
              class="w-full bg-slate-50 dark:bg-slate-900 border-none rounded-lg text-sm focus:ring-2 focus:ring-primary/50 text-slate-700 dark:text-slate-200 cursor-pointer">
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </div>
          <button id="users-refresh"
            class="size-10 flex items-center justify-center bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-400 transition-colors">
            <span class="material-symbols-outlined">refresh</span>
          </button>
        </div>

        <!-- Bulk actions + export -->
        <div class="flex items-center justify-between px-2">
          <div class="flex items-center gap-3">
            <p id="users-selected" class="text-sm text-slate-500 dark:text-slate-400"></p>
            <div class="h-4 w-px bg-slate-300 dark:bg-slate-700"></div>
            <button id="users-bulk-suspend"
              class="text-sm font-semibold text-amber-600 dark:text-amber-500 hover:underline flex items-center gap-1">
              <span class="material-symbols-outlined text-lg">block</span>
              Seçilenleri Askıya Al
            </button>
          </div>
          <button id="users-export-csv"
            class="text-sm font-semibold text-slate-600 dark:text-slate-400 hover:text-primary transition-colors flex items-center gap-1">
            <span class="material-symbols-outlined text-lg">download</span>
            Dışa Aktar (CSV)
          </button>
        </div>

        <!-- Table -->
        <div
          class="bg-white dark:bg-[#161f2e] rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr
                  class="bg-slate-50/50 dark:bg-slate-800/50 border-b border-slate-200 dark:border-slate-800 text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400">
                  <th class="p-4 w-10">
                    <input class="rounded border-slate-300 dark:border-slate-700 text-primary focus:ring-primary bg-transparent"
                      type="checkbox" />
                  </th>
                  <th class="p-4">Kullanıcı</th>
                  <th class="p-4">Şehir / Üniversite</th>
                  <th class="p-4 text-center">RS Skoru</th>
                  <th class="p-4">Kayıt Tarihi</th>
                  <th class="p-4">Durum</th>
                  <th class="p-4 text-right">İşlemler</th>
                </tr>
              </thead>
              <tbody id="users-table-body" class="divide-y divide-slate-200 dark:divide-slate-800">
                <!-- users.js dolduracak -->
              </tbody>
            </table>
          </div>
          <div
            class="p-4 bg-slate-50/50 dark:bg-slate-800/50 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <p id="users-info" class="text-sm text-slate-500 dark:text-slate-400"></p>
            <div id="users-pagination" class="flex items-center gap-2"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/admin/common.js"></script>
  <script src="/admin/users.js"></script>
</body>
</html>
