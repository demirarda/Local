<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LOCAL — Mekan paneli</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #111; margin: 0; }
    main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    h2 { font-size: 16px; margin: 18px 0 8px; }
    p.sub, .muted { color: #666; font-size: 14px; line-height: 1.45; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input, textarea, select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #e8e8e8; border-radius: 8px; font: inherit; }
    button { margin-top: 12px; padding: 12px 16px; border: 0; border-radius: 8px; background: #111; color: #fff; font-weight: 600; cursor: pointer; }
    button.ghost { background: #fff; color: #111; border: 1px solid #ddd; margin-right: 8px; }
    button:disabled { opacity: .5; }
    .card { background: #fff; border: 1px solid #eee; border-radius: 12px; padding: 16px; margin-top: 16px; }
    .tabs { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .tabs button { margin-top: 0; background: #fff; color: #111; border: 1px solid #ddd; }
    .tabs button.on { background: #111; color: #fff; }
    .err { color: #b91c1c; font-size: 13px; }
    .ok { color: #15803d; font-size: 13px; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 14px; align-items: center; }
    a { color: #111; }
  </style>
</head>
<body>
  <main>
    <p class="muted"><a href="/venue/apply.html">Başvuru</a> · Mekan paneli</p>
    <h1>Mekan yönetimi</h1>
    <p class="sub">Web ev: takvim, paket, rapor arşivi, saatler, personel. GPS / totem / vardiya telefonda — tarayıcıdan mühür yok.</p>
    <div id="auth" class="card">
      <label>E-posta</label>
      <input id="email" type="email" autocomplete="username" />
      <label>Şifre</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button id="loginBtn" type="button">Giriş yap</button>
      <p id="authMsg" class="err"></p>
    </div>
    <div id="app" hidden>
      <p id="flash" class="ok"></p>
      <div class="card">
        <label>Mekan</label>
        <select id="venueSel"></select>
        <p id="roleLine" class="muted"></p>
      </div>
          <div class="tabs" id="tabs">
            <button type="button" data-tab="cal">Takvim</button>
            <button type="button" data-tab="hours">Saatler</button>
            <button type="button" data-tab="pkg">Paket</button>
            <button type="button" data-tab="rep">Rapor</button>
            <button type="button" data-tab="staff">Personel</button>
          </div>
      <section id="tab-cal" class="card" hidden></section>
      <section id="tab-hours" class="card" hidden></section>
      <section id="tab-pkg" class="card" hidden></section>
      <section id="tab-rep" class="card" hidden></section>
      <section id="tab-staff" class="card" hidden></section>
    </div>
  </main>
  <script src="/venue/common.js"></script>
  <script src="/venue/panel.js"></script>
</body>
</html>
