<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OB-12 · Verify Modal (Bottom Sheet)</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #1B2E4A;
  --gold: #C8A96A;
  --amber: #D97706;
  --green: #27500A;
  --bg: #F8F6F2;
  --card: #FFFFFF;
  --text: #1B2E4A;
  --muted: #737373;
  --border: rgba(27, 46, 74, 0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #E5E3DD;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 24px;
  min-height: 100vh;
}
.frame {
  width: 390px;
  background: var(--bg);
  position: relative;
  border-radius: 38px;
  overflow: hidden;
  box-shadow: 0 24px 80px rgba(0,0,0,0.18);
  height: 844px;
}
/* Background dimmed app */
.bg-content {
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, transparent 0%, transparent 30%, rgba(0,0,0,0.55) 100%),
    linear-gradient(180deg, #FEF3C7 0%, #FDE68A 8%, var(--bg) 8%);
  filter: blur(0.5px);
}
.bg-card-1, .bg-card-2 {
  position: absolute;
  border-radius: 16px;
  opacity: 0.4;
}
.bg-card-1 {
  top: 130px; left: 20px; right: 20px;
  height: 220px;
  background: linear-gradient(135deg, #1A1A2E, #3A2850);
}
.bg-card-2 {
  top: 370px; left: 20px;
  width: 175px; height: 180px;
  background: linear-gradient(135deg, #5B3A1E, #8B6536);
}
.bg-card-3 {
  position: absolute;
  top: 370px; right: 20px;
  width: 175px; height: 180px;
  background: linear-gradient(135deg, #1F3B30, #2F5747);
  border-radius: 16px;
  opacity: 0.4;
}

/* Backdrop overlay */
.backdrop {
  position: absolute;
  inset: 0;
  background: rgba(13, 21, 36, 0.55);
  backdrop-filter: blur(2px);
}

/* Bottom sheet */
.sheet {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--bg);
  border-top-left-radius: 28px;
  border-top-right-radius: 28px;
  padding: 14px 28px 36px;
  box-shadow: 0 -16px 40px rgba(0,0,0,0.15);
  animation: slideUp 0.3s ease-out;
}
@keyframes slideUp {
  from { transform: translateY(40%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.handle {
  width: 38px;
  height: 5px;
  background: rgba(27, 46, 74, 0.18);
  border-radius: 100px;
  margin: 0 auto 28px;
}

/* Lock icon */
.lock-circle {
  width: 78px;
  height: 78px;
  border-radius: 24px;
  background: linear-gradient(135deg, #FEF3C7 0%, #FDE68A 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  margin: 0 auto 24px;
  position: relative;
}
.lock-circle::after {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 30px;
  border: 1px dashed rgba(217, 119, 6, 0.35);
}

/* Title */
.title {
  font-family: 'Instrument Serif', serif;
  font-size: 28px;
  line-height: 1.15;
  text-align: center;
  color: var(--text);
  margin-bottom: 10px;
}
.subtitle {
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
  color: var(--muted);
  margin-bottom: 24px;
  padding: 0 8px;
}
.subtitle strong { color: var(--text); font-weight: 500; }

/* Email card */
.email-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.ec-icon {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: rgba(27, 46, 74, 0.06);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
.ec-text { flex: 1; min-width: 0; }
.ec-label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 0.04em;
  margin-bottom: 2px;
}
.ec-email {
  font-size: 14px;
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ec-status {
  font-size: 11px;
  color: var(--amber);
  font-weight: 600;
  white-space: nowrap;
}

/* Buttons */
.btn-primary {
  width: 100%;
  background: var(--text);
  color: #fff;
  font-family: 'DM Sans';
  font-size: 15px;
  font-weight: 600;
  padding: 16px;
  border: none;
  border-radius: 100px;
  margin-bottom: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary::after {
  content: "→";
  font-size: 16px;
}
.btn-secondary {
  width: 100%;
  background: transparent;
  color: var(--muted);
  font-family: 'DM Sans';
  font-size: 14px;
  font-weight: 500;
  padding: 12px;
  border: none;
  cursor: pointer;
}

/* Footer note */
.foot-note {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 6px;
  line-height: 1.5;
}
.foot-note .gold { color: var(--gold); }

/* Annotation */
.annot {
  position: fixed;
  top: 24px;
  left: 24px;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  background: var(--text);
  color: #fff;
  padding: 8px 12px;
  border-radius: 8px;
  letter-spacing: 0.05em;
  z-index: 100;
}
.annot strong { color: var(--gold); margin-right: 6px; }
</style>
</head>
<body>
<div class="annot"><strong>OB-12</strong>Verify to Join · Bottom Sheet Modal</div>

<div class="frame">
  <!-- Background app (dimmed) -->
  <div class="bg-content"></div>
  <div class="bg-card-1"></div>
  <div class="bg-card-2"></div>
  <div class="bg-card-3"></div>

  <!-- Backdrop -->
  <div class="backdrop"></div>

  <!-- Bottom sheet -->
  <div class="sheet">
    <div class="handle"></div>

    <div class="lock-circle">🔒</div>

    <h2 class="title">LOCAL'a katılmak için<br>doğrulamanı tamamla</h2>
    <p class="subtitle">Ritual'lara katılmak, arkadaş eklemek ve <strong>RS skorunu kazanmak</strong> için üniversite e-postanı doğrulaman gerekli.</p>

    <!-- Email card -->
    <div class="email-card">
      <div class="ec-icon">✉</div>
      <div class="ec-text">
        <div class="ec-label">E-POSTA</div>
        <div class="ec-email">arda.demir@studbocconi.it</div>
      </div>
      <div class="ec-status">Bekliyor</div>
    </div>

    <!-- Buttons -->
    <button class="btn-primary">Şimdi doğrula</button>
    <button class="btn-secondary">Belki daha sonra</button>

    <p class="foot-note">Doğrulama linki <span class="gold">5 dakika</span> içinde gelir · ücretsiz</p>
  </div>
</div>

</body>
</html>
